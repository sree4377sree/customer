<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>Create Support Ticket - Customer Support System</title>
</head>
<body>
<div id="main-content">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/tickets}">Tickets</a></li>
                    <li class="breadcrumb-item active" aria-current="page">New Ticket</li>
                </ol>
            </nav>
            <h2 class="h3 fw-bold mb-0">Create New Support Ticket</h2>
        </div>
        <a th:href="@{/tickets}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Tickets
        </a>
    </div>

    <!-- Form -->
    <form th:action="@{/tickets/new}" th:object="${ticketDto}" method="post">
        <div class="row g-4">
            
            <!-- Left Column: Customer Details -->
            <div class="col-12 col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h6 class="mb-0 fw-bold"><i class="bi bi-person-circle text-primary me-2"></i>Customer Information</h6>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Customer Full Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{customerName}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. Jane Doe">
                            <div class="invalid-feedback" th:errors="*{customerName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Customer Email Address <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{customerEmail}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. jane.doe@company.com">
                            <div class="invalid-feedback" th:errors="*{customerEmail}"></div>
                            <small class="text-muted">Used by customer to track ticket updates</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" th:field="*{customerPhone}" class="form-control" placeholder="+1 (555) 000-0000">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Company / Department</label>
                            <input type="text" th:field="*{customerCompany}" class="form-control" placeholder="e.g. Acme Corp / Marketing">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Ticket Specifications -->
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h6 class="mb-0 fw-bold"><i class="bi bi-ticket-detailed text-primary me-2"></i>Ticket Specifications</h6>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Subject / Title <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" placeholder="Brief summary of the issue...">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-4">
                                <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                <select th:field="*{category}" class="form-select" th:errorclass="is-invalid">
                                    <option th:each="cat : ${allCategories}" th:value="${cat}" th:text="${cat.displayName}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-sm-4">
                                <label class="form-label fw-semibold">Priority Level <span class="text-danger">*</span></label>
                                <select th:field="*{priority}" class="form-select" th:errorclass="is-invalid">
                                    <option th:each="p : ${allPriorities}" th:value="${p}" th:text="${p.displayName}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-sm-4">
                                <label class="form-label fw-semibold">Assign To Employee</label>
                                <select th:field="*{assignedEmployeeId}" class="form-select">
                                    <option value="">-- Unassigned --</option>
                                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.fullName} + ' (' + ${emp.department} + ')'"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Detailed Issue Description <span class="text-danger">*</span></label>
                            <textarea th:field="*{description}" rows="6" class="form-control" th:errorclass="is-invalid" placeholder="Please describe the steps to reproduce, error messages observed, and impact..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/tickets}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 d-flex align-items-center gap-2 shadow-sm">
                                <i class="bi bi-check2-circle fs-5"></i>
                                <span>Create Support Ticket</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </form>

</div>
</body>
</html>
